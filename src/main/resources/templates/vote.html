<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Vote on Poll</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        .choice-option { margin: 10px 0; }
        button { margin-top: 15px; padding: 10px 15px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
<h1 th:text="${question.text}">Question Text</h1>

<form th:action="@{/vote/{id}(id=${question.id})}" method="post">
    <div th:each="choice : ${question.choices}" class="choice-option">
        <input type="radio" th:id="'choice-' + ${choice.id}" name="choiceId" th:value="${choice.id}" required>
        <label th:for="'choice-' + ${choice.id}" th:text="${choice.text}">Choice text</label>
    </div>
    <button type="submit">Cast Vote</button>
</form>
<br>
<a href="/">Back to Home</a>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <title>Poll App - Home</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        .poll-card { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
        a { text-decoration: none; color: #0066cc; }
        .btn { display: inline-block; padding: 8px 12px; background: #28a745; color: white; border-radius: 4px; }
    </style>
</head>
<body>
<h1>Available Polls</h1>
<a href="/create" class="btn">+ Create New Poll</a>
<hr>

<div th:if="${#lists.isEmpty(questions)}">
    <p>No questions created yet.</p>
</div>

<div th:each="question : ${questions}" class="poll-card">
    <h3 th:text="${question.text}">Question text</h3>
    <p th:text="${question.choices.size()} + ' Choices'"></p>
    <a th:href="@{/vote/{id}(id=${question.id})}">Vote Now</a> |
    <a th:href="@{/results/{id}(id=${question.id})}">View Results</a>
</div>
</body>
</html>
